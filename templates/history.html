    <style>
        /* CSS for the pop-up box */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none; /* Initially hidden */
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none; /* Initially hidden */
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: #888;
            cursor: pointer;
        }

        .close:hover {
            color: #555;
        }

        #popupContent {
            font-size: 15px;
            line-height: 1.5;
        }

        /* CSS for the dropdowns */
        select {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>

        // Function to populate dropdown options
        function populateDropdown(selectElement, options) {
            selectElement.innerHTML = ''; // Clear existing options
            options.forEach(function(option) {
                var optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                selectElement.appendChild(optionElement);
            });
        }

        // Populate state dropdown
        var stateDropdown = document.getElementById('State');
        populateDropdown(stateDropdown, Object.keys(stateDistricts));

        // Populate district dropdown based on selected state
        document.getElementById('State').addEventListener('change', function() {
            var selectedState = this.value;
            var districtDropdown = document.getElementById('District');
            populateDropdown(districtDropdown, stateDistricts[selectedState]);
        });

        document.getElementById("predictionForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('/history', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                displayPopup(data.message);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

        function displayPopup(content) {
    // Split the content into lines using the comma as a delimiter
    var lines = content.split(', ');

    // Create separate div elements for each line
    var contentHTML = '';
    lines.forEach(function(line) {
        contentHTML += '<div>' + line + '</div>';
    });

    // Set the HTML content of the popup
    document.getElementById("popupContent").innerHTML = contentHTML;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
}

        function closePopup() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("popup").style.display = "none";
        }
